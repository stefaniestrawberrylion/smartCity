<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Incident Response Platform</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="dashboard-container">
    <header class="dashboard-header">
        Smart City Incident Response Platform
    </header>

    <div class="cards-row">
        <div class="card card-cyber">
            <div class="card-title">Cyber Aanvallen <span class="icon">!</span></div>
            <div class="card-content">
                <span class="count">100</span>
                <button class="button">Bekijk Meer</button>
            </div>
        </div>
        <div class="card card-traffic">
            <div class="card-title">Verkeersproblemen <span class="icon">⚠</span></div>
            <div class="card-content">
                <span class="count">50</span>
                <button class="button">Bekijk Meer</button>
            </div>
        </div>
        <div class="card card-iot">
            <div class="card-title">storingen in IoT-apparaten <span class="icon">📶</span></div>
            <div class="card-content">
                <span class="count">20</span>
                <button class="button">Bekijk Meer</button>
            </div>
        </div>
        <div class="card card-empty"></div>
    </div>

    <div class="main-content-row">
        <div class="chart-area">
            <div class="bar-chart-representation">
                <div class="bar bar-1"></div>
                <div class="bar bar-2"></div>
                <div class="bar bar-3"></div>
                <div class="bar bar-4"></div>
            </div>
        </div>

        <div class="sensors-list">
            <div class="sensor-item active">
                Sensor 1
                <span class="status active">Actief •</span>
            </div>
            <div class="sensor-item active">
                Sensor 2
                <span class="status active">Actief •</span>
            </div>
            <div class="sensor-item active">
                Sensor 3
                <span class="status active">Actief •</span>
            </div>
            <div class="sensor-item inactive">
                Sensor 4
                <span class="status inactive">Inactief •</span>
            </div>
        </div>
    </div>
</div>
<script src="/script.js"></script>
</body>
</html>
