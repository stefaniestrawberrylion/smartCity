<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Incident Response Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="dashboard-container">
    <header class="dashboard-header">
        Smart City Incident Response Platform
    </header>

    <div class="cards-row">
        <div class="card card-cyber">
            <div class="card-title">Cyber Aanvallen <span class="icon">!</span></div>
            <div class="card-content">
                <span class="count" id="count-cyber">0</span>
                <button class="button">Bekijk Meer</button>
            </div>
        </div>
        <div class="card card-traffic">
            <div class="card-title">Verkeersproblemen <span class="icon">⚠</span></div>
            <div class="card-content">
                <span class="count" id="count-traffic">0</span>
                <button class="button">Bekijk Meer</button>
            </div>
        </div>
        <div class="card card-iot">
            <div class="card-title">Storingen in IoT-apparaten <span class="icon">📶</span></div>
            <div class="card-content">
                <span class="count" id="count-iot">0</span>
                <button class="button">Bekijk Meer</button>
            </div>
        </div>
        <div class="card card-empty"></div>
    </div>

    <div class="main-content-row">
        <div class="chart-area">
            <div class="bar-chart-representation" id="bar-chart">
            </div>
        </div>

        <div class="sensors-list" id="sensors-list">
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
